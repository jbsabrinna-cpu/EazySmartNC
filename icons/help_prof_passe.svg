<svg width="380" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="380" height="200" fill="#13151a"/>
  <!-- Surface -->
  <rect x="60" y="30" width="240" height="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="308" y="40" font-size="10" fill="rgba(255,255,255,0.4)" font-family="monospace">Z0</text>
  <!-- Passes Z successives -->
  <rect x="80" y="42"  width="180" height="22" fill="rgba(86,212,78,0.15)" stroke="rgba(86,212,78,0.5)" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="80" y="64"  width="180" height="22" fill="rgba(86,212,78,0.15)" stroke="rgba(86,212,78,0.5)" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="80" y="86"  width="180" height="22" fill="rgba(86,212,78,0.15)" stroke="rgba(86,212,78,0.5)" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="80" y="108" width="180" height="18" fill="rgba(86,212,78,0.15)" stroke="rgba(86,212,78,0.5)" stroke-width="1" stroke-dasharray="4,2"/>
  <!-- Labels passes -->
  <text x="175" y="57"  text-anchor="middle" font-size="9" fill="rgba(86,212,78,0.7)" font-family="monospace">Passe 1</text>
  <text x="175" y="79"  text-anchor="middle" font-size="9" fill="rgba(86,212,78,0.7)" font-family="monospace">Passe 2</text>
  <text x="175" y="101" text-anchor="middle" font-size="9" fill="rgba(86,212,78,0.7)" font-family="monospace">Passe 3</text>
  <text x="175" y="121" text-anchor="middle" font-size="9" fill="rgba(86,212,78,0.7)" font-family="monospace">Passe 4</text>
  <!-- Flèche prof passe (entre passe 1 et 2) -->
  <line x1="276" y1="42" x2="276" y2="64" stroke="#f0a500" stroke-width="1.5"/>
  <polygon points="276,42 272,50 280,50" fill="#f0a500"/>
  <polygon points="276,64 272,56 280,56" fill="#f0a500"/>
  <text x="290" y="57" font-size="10" fill="#f0a500" font-family="monospace">ap</text>
  <!-- Fond poche -->
  <line x1="80" y1="126" x2="260" y2="126" stroke="#56d44e" stroke-width="2"/>
  <text x="190" y="195" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)" font-family="monospace">Profondeur par passe (ap) en mm</text>
</svg>
