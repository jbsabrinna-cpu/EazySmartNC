<svg width="380" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="380" height="200" fill="#13151a"/>
  <!-- Surface pièce -->
  <rect x="60" y="80" width="260" height="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="328" y="90" font-size="10" fill="rgba(255,255,255,0.4)" font-family="monospace">Z0</text>
  <!-- Plan approche -->
  <line x1="60" y1="50" x2="320" y2="50" stroke="rgba(86,212,78,0.3)" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="328" y="54" font-size="10" fill="rgba(86,212,78,0.5)" font-family="monospace">Zapp</text>
  <!-- Flèche G0 (rapide) -->
  <line x1="130" y1="20" x2="130" y2="50" stroke="#f0a500" stroke-width="2"/>
  <polygon points="130,50 125,42 135,42" fill="#f0a500"/>
  <text x="140" y="38" font-size="9" fill="#f0a500" font-family="monospace">G0 rapide</text>
  <!-- Flèche approche -->
  <line x1="200" y1="50" x2="200" y2="80" stroke="#56d44e" stroke-width="2"/>
  <polygon points="200,80 195,72 205,72" fill="#56d44e"/>
  <!-- Cote approche -->
  <line x1="240" y1="50" x2="240" y2="80" stroke="#56d44e" stroke-width="1.2"/>
  <polygon points="240,50 236,58 244,58" fill="#56d44e"/>
  <polygon points="240,80 236,72 244,72" fill="#56d44e"/>
  <line x1="228" y1="50" x2="248" y2="50" stroke="#56d44e" stroke-width="1"/>
  <line x1="228" y1="80" x2="248" y2="80" stroke="#56d44e" stroke-width="1"/>
  <text x="255" y="68" font-size="10" fill="#56d44e" font-family="monospace">approche</text>
  <!-- Poche -->
  <rect x="100" y="92" width="180" height="70" fill="rgba(86,212,78,0.05)" stroke="rgba(86,212,78,0.3)" stroke-width="1"/>
  <text x="190" y="195" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)" font-family="monospace">Distance d'approche rapide au-dessus de Z0</text>
</svg>
