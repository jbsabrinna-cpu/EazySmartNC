<svg width="380" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="380" height="200" fill="#13151a"/>
  <!-- Parois matière -->
  <rect x="60" y="40" width="260" height="130" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- Zone ébauche (surépaisseur laissée) -->
  <rect x="80" y="60" width="220" height="90" fill="rgba(240,165,0,0.08)" stroke="#f0a500" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Cote finale -->
  <rect x="92" y="72" width="196" height="66" fill="rgba(86,212,78,0.07)" stroke="#56d44e" stroke-width="2"/>
  <!-- Flèches surep gauche -->
  <line x1="80" y1="105" x2="92" y2="105" stroke="#f0a500" stroke-width="1.5"/>
  <polygon points="80,105 87,101 87,109" fill="#f0a500"/>
  <polygon points="92,105 85,101 85,109" fill="#f0a500"/>
  <!-- Flèches surep droite -->
  <line x1="288" y1="105" x2="300" y2="105" stroke="#f0a500" stroke-width="1.5"/>
  <polygon points="300,105 293,101 293,109" fill="#f0a500"/>
  <polygon points="288,105 295,101 295,109" fill="#f0a500"/>
  <!-- Labels -->
  <text x="86" y="99" font-size="9" fill="#f0a500" font-family="monospace">s</text>
  <text x="152" y="109" text-anchor="middle" font-size="10" fill="#56d44e" font-family="monospace">cote finale</text>
  <text x="190" y="172" text-anchor="middle" font-size="9" fill="#f0a500" font-family="monospace">— ébauche (surep laissée) —</text>
  <text x="190" y="195" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)" font-family="monospace">Surépaisseur latérale (mm)</text>
</svg>
