<svg width="380" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="380" height="200" fill="#13151a"/>
  <!-- Poche vue de dessus -->
  <rect x="80" y="50" width="220" height="110" rx="8" fill="rgba(86,212,78,0.07)" stroke="rgba(86,212,78,0.5)" stroke-width="1.5"/>
  <!-- Cote longueur -->
  <line x1="80" y1="175" x2="300" y2="175" stroke="#f0a500" stroke-width="1.2"/>
  <polygon points="80,175 88,171 88,179" fill="#f0a500"/>
  <polygon points="300,175 292,171 292,179" fill="#f0a500"/>
  <line x1="80"  y1="160" x2="80"  y2="180" stroke="#f0a500" stroke-width="1"/>
  <line x1="300" y1="160" x2="300" y2="180" stroke="#f0a500" stroke-width="1"/>
  <text x="190" y="170" text-anchor="middle" font-size="11" fill="#f0a500" font-family="monospace">Longueur</text>
  <!-- Cote largeur -->
  <line x1="320" y1="50" x2="320" y2="160" stroke="#44aaff" stroke-width="1.2"/>
  <polygon points="320,50 316,58 324,58" fill="#44aaff"/>
  <polygon points="320,160 316,152 324,152" fill="#44aaff"/>
  <line x1="305" y1="50"  x2="325" y2="50"  stroke="#44aaff" stroke-width="1"/>
  <line x1="305" y1="160" x2="325" y2="160" stroke="#44aaff" stroke-width="1"/>
  <text x="340" y="110" text-anchor="middle" font-size="11" fill="#44aaff" font-family="monospace" transform="rotate(90,340,110)">Largeur</text>
  <!-- Centre -->
  <circle cx="190" cy="105" r="3" fill="rgba(255,255,255,0.3)"/>
  <line x1="180" y1="105" x2="200" y2="105" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="190" y1="95"  x2="190" y2="115" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="190" y="195" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)" font-family="monospace">Longueur × Largeur de la poche (mm)</text>
</svg>
