<svg width="380" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="380" height="200" fill="#13151a"/>
  <!-- Poche avec coins arrondis (vue de dessus) -->
  <rect x="80" y="40" width="220" height="120" rx="20" fill="rgba(86,212,78,0.07)" stroke="rgba(86,212,78,0.5)" stroke-width="1.5"/>
  <!-- Zoom coin BD -->
  <rect x="230" y="100" width="80" height="70" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Coin BD agrandi -->
  <path d="M 240,165 L 240,120 Q 240,110 250,110 L 300,110" fill="none" stroke="#56d44e" stroke-width="2"/>
  <!-- Arc rayon -->
  <path d="M 240,120 Q 240,110 250,110" fill="none" stroke="#f0a500" stroke-width="2"/>
  <!-- Flèche rayon -->
  <line x1="240" y1="120" x2="250" y2="110" stroke="#f0a500" stroke-width="1.2" stroke-dasharray="3,2"/>
  <circle cx="240" cy="120" r="2" fill="#f0a500"/>
  <text x="245" y="125" font-size="9" fill="#f0a500" font-family="monospace">R</text>
  <text x="235" y="108" font-size="8" fill="rgba(255,255,255,0.3)" font-family="monospace">zoom</text>
  <text x="190" y="195" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)" font-family="monospace">Rayon d'angle en coins de poche (mm)</text>
</svg>
