<svg width="380" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="380" height="200" fill="#13151a"/>
  <!-- Titre colonnes -->
  <text x="63"  y="22" text-anchor="middle" font-size="9" fill="#56d44e" font-family="monospace">Hélice</text>
  <text x="190" y="22" text-anchor="middle" font-size="9" fill="#44aaff" font-family="monospace">Rampe</text>
  <text x="317" y="22" text-anchor="middle" font-size="9" fill="#dd88ff" font-family="monospace">Directe</text>
  <!-- Séparateurs -->
  <line x1="127" y1="15" x2="127" y2="170" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="253" y1="15" x2="253" y2="170" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Col 1 : Hélice -->
  <rect x="20" y="30" width="87" height="120" rx="3" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <ellipse cx="63" cy="55" rx="25" ry="8" fill="none" stroke="#56d44e" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M 88,55 Q 88,80 63,88 Q 38,96 38,120 Q 38,135 63,135" fill="none" stroke="#56d44e" stroke-width="2"/>
  <polygon points="63,135 59,127 67,127" fill="#56d44e"/>

  <!-- Col 2 : Rampe zigzag -->
  <rect x="147" y="30" width="87" height="120" rx="3" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <polyline points="155,40 229,65 155,90 229,115 155,135" fill="none" stroke="#44aaff" stroke-width="2"/>
  <polygon points="155,135 161,127 163,136" fill="#44aaff"/>

  <!-- Col 3 : Directe -->
  <rect x="273" y="30" width="87" height="120" rx="3" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="317" y1="40" x2="317" y2="135" stroke="#dd88ff" stroke-width="2.5"/>
  <polygon points="317,135 312,123 322,123" fill="#dd88ff"/>
  <circle cx="317" cy="40" r="4" fill="#dd88ff" opacity="0.6"/>

  <text x="190" y="195" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)" font-family="monospace">Mode de plongée dans la poche</text>
</svg>
